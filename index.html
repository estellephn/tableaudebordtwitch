<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12030f">
  <title>Piixelie – Tableau de bord contenu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 class="sign">Piixelie</h1>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab is-active" role="tab" aria-selected="true" data-tab="streams">Streams</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="clips">Clips</button>
    </nav>
    <button class="sync" id="syncBtn" aria-haspopup="dialog">
      <span class="dot" id="syncDot"></span><span id="syncLabel">Connexion</span>
    </button>
  </header>

  <main>
    <!-- STREAMS -->
    <section id="tab-streams" class="panel">
      <form id="streamForm" class="add">
        <label class="field grow">Titre du stream
          <input id="sTitle" type="text" placeholder="Ex : Minecraft Homestead, épisode 3" required maxlength="120">
        </label>
        <label class="field half">Date
          <input id="sDate" type="date" required>
        </label>
        <label class="field half">Heure de début
          <input id="sTime" type="time" required>
        </label>
        <button class="btn" type="submit">Ajouter le stream</button>
      </form>

      <div class="bar">
        <p class="count" id="streamCount"></p>
        <div class="filters">
          <label class="inline"><input type="checkbox" id="streamTodo"><span>Voir seulement ceux à finir</span></label>
          <label class="inline"><input type="checkbox" id="streamArchived"><span>Voir les archivés</span></label>
        </div>
      </div>
      <div id="streamList" class="list"></div>
    </section>

    <!-- CLIPS -->
    <section id="tab-clips" class="panel" hidden>
      <form id="clipForm" class="add">
        <label class="field grow">Nom de l'extrait
          <input id="cName" type="text" placeholder="Ex : Mort ridicule dans la lave" required maxlength="120">
        </label>
        <label class="field">Stream d'origine
          <select id="cStream"><option value="">Aucun</option></select>
        </label>
        <button class="btn" type="submit">Ajouter le clip</button>
      </form>

      <div class="bar">
        <p class="count" id="clipCount"></p>
        <div class="filters">
          <label class="inline"><input type="checkbox" id="clipTodo"><span>Voir seulement ceux à publier</span></label>
          <label class="inline"><input type="checkbox" id="clipArchived"><span>Voir les archivés</span></label>
        </div>
      </div>
      <div id="clipList" class="list"></div>
    </section>
  </main>

  <!-- Fenêtre de sauvegarde -->
  <dialog id="syncDialog">
    <h2>Connexion</h2>

    <section class="auth">
      <p id="authOff" hidden>Supabase n'est pas encore configuré : renseigne <code>config.js</code>.</p>
      <form id="authIn" hidden>
        <p>Connecte-toi pour accéder à tes données, synchronisées sur tous tes appareils.</p>
        <div class="actions">
          <input id="authEmail" type="email" placeholder="ton@mail.fr" required autocomplete="username">
          <input id="authPass" type="password" placeholder="Mot de passe" required minlength="6" autocomplete="current-password">
        </div>
        <div class="actions">
          <button class="btn" type="submit">Se connecter</button>
          <button class="btn ghost" id="signupBtn" type="button">Créer le compte</button>
        </div>
        <p class="status" id="authMsg" role="status"></p>
      </form>
      <div id="authOut" hidden>
        <p class="status">Connectée : <span id="authMail"></span></p>
        <form id="passForm" class="actions">
          <input id="newPass" type="password" placeholder="Nouveau mot de passe" required minlength="6" autocomplete="new-password">
          <button class="btn ghost" type="submit">Définir le mot de passe</button>
        </form>
        <p class="status" id="passMsg" role="status"></p>
        <div class="actions"><button class="btn ghost" id="logoutBtn" type="button">Se déconnecter</button></div>
      </div>
    </section>

    <button class="close" id="closeDialog" aria-label="Fermer">Fermer</button>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
